<div class="modal-outer">
    <div class="modal-overline">
        Коммерческое предложение
    </div>
    <div class="modal-title">
        Philips Prodiva 1.5 T CX
    </div>
    <form action="/data/api/success.html" method="get" class="modal-form form" novalidate="novalidate"
          autocomplete="off">
        <input type="hidden" name="id" value="1" />
        <div class="row">
            <div class="col-12">
                <div class="form-group">
                    <input type="text" name="name" class="form-control" placeholder="Имя" required />
                </div>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <input type="tel" name="phone" class="form-control" placeholder="Телефон" required />
                </div>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <input type="email" name="email" class="form-control" placeholder="E-mail" />
                </div>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <textarea name="message" class="form-control" placeholder="Ваш вопрос"></textarea>
                </div>
            </div>
            <div class="col-12">
                <div class="form-group">
                    <label class="form-label">Удобное время для звонка</label>
                    <div class="form-range double-range">
                        <input type="text" name="from" value="08:00" class="form-range-input input-from form-control" />
                        <input type="text" name="to" value="22:00" class="form-range-input input-to form-control" />
                        <div class="form-range-slider input-slider" data-min="08:00" data-max="22:00" data-start="08:00"
                             data-end="22:00"></div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12">
                <button type="submit" class="btn btn-primary">Отправить запрос</button>
            </div>
            <div class="col-12">
                <div class="form-text">
                    Нажимая на кнопку, я соглашаюсь на обработку <a href="#">персональных данных</a>
                </div>
            </div>
            <div class="col-12">
                <div class="form-check">
                    <label class="form-check-label">
                        <input type="checkbox" name="subscribe" checked />
                        <span class="form-check-icon"></span>
                        <span class="form-check-text">
                            Согласен получать информационную и рекламную рассылку
                        </span>
                    </label>
                </div>
            </div>
        </div>
    </form>
</div>
